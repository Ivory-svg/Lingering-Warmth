<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>余温</title>
  <style>
    :root { color-scheme: light; font-family: system-ui, sans-serif; background: #f5f1eb; color: #352f2b; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; }
    main { width: min(760px, 100%); height: 100vh; display: grid; grid-template-rows: auto 1fr auto; background: #fffdfa; }
    header { padding: 18px 22px; border-bottom: 1px solid #e8ded3; display: flex; align-items: center; justify-content: space-between; }
    h1 { font-size: 20px; margin: 0; font-weight: 600; }
    header a { color: #765f4d; font-size: 13px; }
    .export-links { display: flex; gap: 10px; }
    #messages { overflow-y: auto; padding: 22px; display: flex; flex-direction: column; gap: 14px; }
    .empty { margin: auto; color: #8d8178; text-align: center; }
    .message { max-width: 78%; padding: 11px 14px; border-radius: 16px; line-height: 1.55; white-space: pre-wrap; overflow-wrap: anywhere; }
    .user { align-self: flex-end; background: #6c5544; color: white; border-bottom-right-radius: 4px; }
    .assistant { align-self: flex-start; background: #f0e8df; border-bottom-left-radius: 4px; }
    .assistant.has-ooc { position: relative; padding-right: 26px; }
    .ooc-mark { position: absolute; top: 8px; right: 8px; width: 9px; height: 9px; padding: 0; border: 0; border-radius: 50%; background: #ad9b8c; cursor: pointer; }
    .ooc-mark:hover, .ooc-mark:focus-visible { background: #6c5544; outline-offset: 3px; }
    .ooc-details { margin-top: 10px; padding-top: 9px; border-top: 1px solid #ddd0c4; color: #705e50; font-size: 12px; white-space: pre-wrap; }
    .ooc-details[hidden] { display: none; }
    .ooc-details input { display: block; box-sizing: border-box; width: 100%; margin-top: 9px; padding: 5px 7px; border: 1px solid #d8cbc0; border-radius: 6px; font: inherit; }
    .ooc-details button { margin-top: 7px; padding: 5px 7px; border: 0; border-radius: 6px; background: #e6d9cc; color: #554638; font: inherit; cursor: pointer; }
    .message-menu { position: fixed; z-index: 10; padding: 5px; border: 1px solid #ddd0c4; border-radius: 10px; background: #fffdfa; box-shadow: 0 6px 20px #352f2b20; }
    .message-menu[hidden] { display: none; }
    .message-menu button { border: 0; border-radius: 6px; padding: 8px 12px; background: none; color: #554638; font: inherit; cursor: pointer; }
    .message-menu button:hover { background: #f0e8df; }
    .handoff { display: flex; align-items: center; gap: 10px; color: #a09287; font-size: 12px; }
    .handoff::before, .handoff::after { content: ""; height: 1px; background: #ddd0c4; flex: 1; }
    form { padding: 16px; border-top: 1px solid #e8ded3; display: flex; gap: 10px; }
    textarea { flex: 1; resize: none; min-height: 44px; max-height: 120px; padding: 11px 13px; border: 1px solid #d8cbc0; border-radius: 12px; font: inherit; }
    form button { border: 0; border-radius: 12px; padding: 0 20px; background: #6c5544; color: white; cursor: pointer; }
    form button:disabled { opacity: .55; cursor: wait; }
    #error { color: #a33; padding: 0 16px 8px; font-size: 13px; }
    #error[data-kind="info"] { color: #705e50; }
  </style>
</head>
<body>
  <main>
    <header><h1>余温</h1><nav class="export-links" aria-label="导出全书"><a href="/export?format=markdown">导出全书（Markdown）</a><a href="/export?format=json">备份全书（JSON）</a></nav></header>
    <section id="messages" aria-live="polite"><p class="empty">人走了，温度还在。</p></section>
    <div id="message-menu" class="message-menu" role="menu" hidden><button id="flag-ooc" type="button" role="menuitem">他不会这么说</button></div>
    <div><div id="error" role="alert"></div><form id="chat-form"><textarea id="content" rows="1" placeholder="说点什么……" required></textarea><button id="send" type="submit">发送</button></form></div>
  </main>
  <script>
    const messages = document.querySelector('#messages');
    const form = document.querySelector('#chat-form');
    const input = document.querySelector('#content');
    const send = document.querySelector('#send');
    const errorBox = document.querySelector('#error');
    const menu = document.querySelector('#message-menu');
    const flagOption = document.querySelector('#flag-ooc');
    let selectedMessage = null;

    function hideMenu() {
      menu.hidden = true;
      selectedMessage = null;
    }
    function showMenu(item, messageId, x, y) {
      selectedMessage = {item, messageId};
      menu.hidden = false;
      const bounds = menu.getBoundingClientRect();
      menu.style.left = `${Math.max(8, Math.min(x, window.innerWidth - bounds.width - 8))}px`;
      menu.style.top = `${Math.max(8, Math.min(y, window.innerHeight - bounds.height - 8))}px`;
      flagOption.focus();
    }
    document.addEventListener('click', (event) => {
      if (!menu.contains(event.target) && !event.target.closest('.message.assistant')) hideMenu();
    });
    window.addEventListener('scroll', hideMenu, true);

    function showOOCMarker(item, ooc) {
      if (!ooc) return;
      let mark = item.querySelector('.ooc-mark');
      let details = item.querySelector('.ooc-details');
      if (!mark) {
        item.classList.add('has-ooc');
        mark = document.createElement('button');
        mark.type = 'button';
        mark.className = 'ooc-mark';
        mark.setAttribute('aria-label', '查看勘误');
        mark.setAttribute('aria-expanded', 'false');
        details = document.createElement('div');
        details.className = 'ooc-details';
        details.hidden = true;
        mark.addEventListener('click', (event) => {
          event.stopPropagation();
          details.hidden = !details.hidden;
          mark.setAttribute('aria-expanded', String(!details.hidden));
        });
        item.append(mark, details);
      }
      details.textContent = `勘误\n原本想说：${ooc.original}\n因为：${ooc.reason}`;
      if (ooc.source === 'player' && ooc.rewritten) {
        details.textContent += `\n建议改成：${ooc.rewritten}`;
      }
      const noteInput = document.createElement('input');
      noteInput.type = 'text';
      noteInput.placeholder = '为什么这条勘误不对（可不填）';
      noteInput.setAttribute('aria-label', '推翻勘误的理由');
      const overturn = document.createElement('button');
      overturn.type = 'button';
      overturn.textContent = '其实他会这么说';
      overturn.addEventListener('click', async () => {
        overturn.disabled = true;
        try {
          const response = await fetch(`/voice-notes/${ooc.voice_note_id}/overturn`, {
            method: 'POST', headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({note: noteInput.value.trim() || null})
          });
          const data = await response.json();
          if (!response.ok) throw new Error(data.detail || '推翻勘误失败');
          item.querySelector('.message-text').textContent = data.content;
          mark.remove();
          details.remove();
          item.classList.remove('has-ooc');
        } catch (error) {
          errorBox.dataset.kind = 'error';
          errorBox.textContent = error.message;
          overturn.disabled = false;
        }
      });
      details.append(noteInput, overturn);
    }

    flagOption.addEventListener('click', async () => {
      if (!selectedMessage) return;
      const {item, messageId} = selectedMessage;
      hideMenu();
      flagOption.disabled = true;
      try {
        const response = await fetch('/ooc/flag', {
          method: 'POST', headers: {'Content-Type': 'application/json'},
          body: JSON.stringify({message_id: messageId, player_rewrite: null})
        });
        const data = await response.json();
        if (!response.ok) throw new Error(data.detail || '标记失败');
        if (data.voice_note_id !== null) {
          showOOCMarker(item, {
            original: item.querySelector('.message-text').textContent,
            reason: data.reason,
            rewritten: data.rewritten,
            voice_note_id: data.voice_note_id,
            source: 'player'
          });
        } else {
          errorBox.dataset.kind = 'info';
          errorBox.textContent = data.reason;
        }
      } catch (error) {
        errorBox.dataset.kind = 'error';
        errorBox.textContent = error.message;
      } finally {
        flagOption.disabled = false;
      }
    });

    function clearEmpty() { document.querySelector('.empty')?.remove(); }
    function addDivider() {
      const line = document.createElement('div');
      line.className = 'handoff';
      line.textContent = '续写 · 新的一卷';
      messages.append(line);
    }
    function addMessage(role, text, messageId = null, ooc = null) {
      clearEmpty();
      const item = document.createElement('div');
      item.className = `message ${role}`;
      const content = document.createElement('span');
      content.className = 'message-text';
      content.textContent = text;
      item.append(content);
      if (role === 'assistant' && messageId !== null) {
        let pressTimer;
        let pressX;
        let pressY;
        item.tabIndex = 0;
        item.addEventListener('contextmenu', (event) => {
          event.preventDefault();
          showMenu(item, messageId, event.clientX, event.clientY);
        });
        item.addEventListener('keydown', (event) => {
          if (event.key === 'ContextMenu' || (event.shiftKey && event.key === 'F10')) {
            event.preventDefault();
            const bounds = item.getBoundingClientRect();
            showMenu(item, messageId, bounds.right, bounds.bottom);
          }
        });
        item.addEventListener('pointerdown', (event) => {
          if (event.pointerType !== 'touch' || event.target.closest('.ooc-mark, .ooc-details')) return;
          pressX = event.clientX;
          pressY = event.clientY;
          pressTimer = setTimeout(() => showMenu(item, messageId, pressX, pressY), 550);
        });
        item.addEventListener('pointermove', (event) => {
          if (event.pointerType !== 'touch') return;
          if (Math.abs(event.clientX - pressX) > 10 || Math.abs(event.clientY - pressY) > 10) {
            clearTimeout(pressTimer);
          }
        });
        for (const eventName of ['pointerup', 'pointercancel', 'pointerleave']) {
          item.addEventListener(eventName, () => clearTimeout(pressTimer));
        }
      }
      showOOCMarker(item, ooc);
      messages.append(item);
      messages.scrollTop = messages.scrollHeight;
    }

    async function restoreMessages() {
      send.disabled = true;
      try {
        const response = await fetch('/messages');
        if (!response.ok) throw new Error('加载历史消息失败');
        for (const message of await response.json()) {
          addMessage(message.role, message.content, message.message_id, message.ooc);
        }
      } catch (error) {
        errorBox.dataset.kind = 'error';
        errorBox.textContent = error.message;
      } finally {
        send.disabled = false;
      }
    }

    form.addEventListener('submit', async (event) => {
      event.preventDefault();
      const content = input.value;
      if (!content.trim()) return;
      errorBox.textContent = '';
      errorBox.dataset.kind = 'error';
      addMessage('user', content);
      input.value = '';
      send.disabled = true;
      try {
        const response = await fetch('/chat', {
          method: 'POST', headers: {'Content-Type': 'application/json'},
          body: JSON.stringify({content})
        });
        const data = await response.json();
        if (!response.ok) throw new Error(data.detail || '发送失败');
        if (data.handoff_happened) addDivider();
        addMessage('assistant', data.reply, data.message_id,
          data.ooc ? {...data.ooc, rewritten: data.reply, source: 'gatekeeper'} : null);
      } catch (error) {
        errorBox.textContent = error.message;
      } finally {
        send.disabled = false;
        input.focus();
      }
    });
    restoreMessages();
  </script>
</body>
</html>
