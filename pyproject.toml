[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "lingering-warmth"
version = "0.1.0"
description = "余温：让角色记住你们共同经历的记忆系统"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "httpx>=0.27,<1",
  "uvicorn>=0.30,<1",
]

[project.optional-dependencies]
test = ["pytest>=8,<10"]

[project.scripts]
yuwen = "yuwen.api:run"

[tool.hatch.build.targets.wheel]
packages = ["src/yuwen"]

[tool.pytest.ini_options]
addopts = "-q"
pythonpath = ["src"]
testpaths = ["tests"]
