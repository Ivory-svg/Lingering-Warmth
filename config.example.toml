[llm]
base_url = "https://api.example.com/v1"
api_key = "请替换为你的 API Key"
model = "请替换为模型名"
# 留空时使用 model。
small_model = ""
context_limit = 64000

[character]
name = "他"
player_name = "对方"
prompt_file = "worldbook/core.md"
worldbook_dir = "worldbook"

[worldbook]
scan_depth = 4
entry_budget = 3000
corpus_sample = 8

[handoff]
trigger_ratio = 0.75
raw_tail = 20
min_turns = 20

[inflow]
every_n_turns = 1

[embedding]
# 留空就按字面找记忆；想按意思找时填 OpenAI 兼容的 embedding 地址。
base_url = ""
api_key = ""
model = "bge-m3"
batch_size = 32

[surfacing]
enabled = true
query_depth = 2
top_k = 4
max_chars = 1500
min_similarity = 0.45
clear_threshold = 0.7

[decay]
base_days = 7

[todo]
enabled = true
max_in_context = 3
cooldown_hours = 12
stale_days = 30
max_open_in_prompt = 10

[forget]
enabled = true
recent_memories = 5

[anniversary]
enabled = true

[wake]
enabled = true
# 留空按服务器本地时间；也可填 Asia/Shanghai 等时区名。
timezone = ""
active_hours = "09:00-23:00"
min_interval_minutes = 40
max_interval_minutes = 120
min_silence_minutes = 60
max_per_day = 3
max_unanswered = 2
# 留空不通知；text 可填 ntfy 频道地址，json 可填自己的接收程序地址。
notify_url = ""
notify_format = "text"

[gatekeeper]
pre_send = true
voice_notes_in_context = 10

[storage]
db_path = "data/yuwen.db"

[server]
host = "127.0.0.1"
port = 8787

[auth]
password = "请设置至少 8 位密码"
session_days = 30
# 放在 HTTPS 后面时设成 true。
secure_cookie = false
